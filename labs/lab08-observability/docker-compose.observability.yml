services:
  order-service:
    build:
      context: ../app
      dockerfile: Dockerfile
      args:
        BUILD_ID: observability-lab
    image: course/order-service:observability-lab
    container_name: order-service-obs
    ports:
      - "8080:8000"
    environment:
      APP_ENV: observability
      BUILD_ID: observability-lab
      PAYMENT_SERVICE_URL: http://payment-service:8000
    networks:
      - obs-network

  payment-service:
    build:
      context: ../app
      dockerfile: Dockerfile.payment
      args:
        BUILD_ID: observability-lab
    image: course/payment-service:observability-lab
    container_name: payment-service-obs
    ports:
      - "8001:8000"
    environment:
      APP_ENV: observability
      BUILD_ID: observability-lab
    networks:
      - obs-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - obs-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - obs-network
    depends_on:
      - prometheus

networks:
  obs-network:
    driver: bridge
