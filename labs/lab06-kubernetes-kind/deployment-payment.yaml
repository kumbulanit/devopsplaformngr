apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001          # must be numeric for runAsNonRoot to be verifiable
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment
          image: payment-service:lab02
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "96Mi"
              cpu: "100m"
            limits:
              # Python + uvicorn needs headroom; 128Mi thrashes on a busy VM
              # and makes /health answer too slowly for the probes.
              memory: "256Mi"
              cpu: "500m"
          # STARTUP probe: gives a cold Python process up to 60s to come up.
          # Without it, liveness can kill the container before it ever starts -
          # the classic restart storm.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 12
          # READINESS decides whether this pod receives traffic.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # LIVENESS decides whether to restart it. Deliberately slower and
          # more forgiving than readiness.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - port: 8000
      targetPort: 8000
