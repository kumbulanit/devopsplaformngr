apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment-payment.yaml
  - deployment-order.yaml

# "labels" replaces the deprecated "commonLabels".
# includeSelectors: false keeps these labels OUT of the immutable
# spec.selector, so re-applying with different labels never conflicts.
labels:
  - pairs:
      course: devops-platform-engineering
      environment: lab06
    includeSelectors: false
    includeTemplates: true
