name: CI — Order Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token: this workflow only needs to read the repository.
permissions:
  contents: read

env:
  IMAGE_NAME: order-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r labs/app/requirements.txt

      - name: Run tests
        working-directory: labs/app
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        working-directory: labs/app
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} --build-arg BUILD_ID=${{ github.sha }} -f Dockerfile .

      - name: Show image metadata
        run: docker images ${{ env.IMAGE_NAME }}

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        working-directory: labs/app
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f Dockerfile .

      # Step 1 — REPORT: list HIGH and CRITICAL findings but never fail the
      # build (exit-code: 0). Useful for visibility while a team triages.
      - name: Trivy report (informational)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

      # Step 2 — GATE: fail the pipeline on any FIXABLE CRITICAL finding.
      # This is what "security gate" actually means: the build goes red.
      # --ignore-unfixed skips CVEs with no released patch (nothing to action).
      - name: Trivy gate (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
